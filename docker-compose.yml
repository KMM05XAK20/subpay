services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: subs
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: subs
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U subs"]
      interval: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    restart: unless-stopped

  bot:
    build: .
    env_file: .env
    environment:
      DB_URL: postgresql+asyncpg://subs:${DB_PASSWORD}@db:5432/subs
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

volumes:
  pgdata:
  redisdata: